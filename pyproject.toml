[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mlb-kalshi-research"
version = "0.1.0"
description = "Reproducible research ingestion for historical Kalshi MLB game markets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "MLB Kalshi Research Contributors" }]
dependencies = [
  "httpx>=0.28,<1",
  "pyarrow>=18,<24",
  "structlog>=25,<26",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
mlb-kalshi = "mlb_kalshi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlb_kalshi"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mlb_kalshi"]
