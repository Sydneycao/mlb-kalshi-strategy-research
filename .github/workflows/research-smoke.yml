name: Research probe and smoke test

on:
  workflow_dispatch:
    inputs:
      max_games:
        description: "Maximum Kalshi game events for the live smoke test"
        required: true
        default: "10"
        type: string
      run_live_smoke:
        description: "Call the public Kalshi and MLB APIs after unit tests"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Probe public APIs
        if: ${{ inputs.run_live_smoke }}
        run: mlb-kalshi probe
      - name: Run bounded smoke test
        if: ${{ inputs.run_live_smoke }}
        env:
          MLB_KALSHI_MAX_GAMES: ${{ inputs.max_games }}
        run: mlb-kalshi smoke
      - name: Build timeline and run strategy simulations
        if: ${{ inputs.run_live_smoke }}
        run: mlb-kalshi backtest
